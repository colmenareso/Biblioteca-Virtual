name: Build and Deploy

# Triggers the workflow every time you push code to the 'main' branch
on:
  push:
    branches:
      - main

# Sets required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Avoids concurrent deployments jamming up
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: Build the site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js (Optional - remove if not using npm/yarn)
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build # Saves production files to a folder like 'dist' or 'build'

      # Uploads the built static folder to GitHub's artifact storage
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # <-- Update this to match your build output folder (e.g., dist, build, public, .)

  # JOB 2: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Waits for the build job to finish successfully
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4